name: Release qualification

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    name: Ghidra ${{ matrix.ghidra }} / JDK ${{ matrix.java }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - ghidra: '12.1.4'
            java: '21'
            java_distribution: '21.0.13+9'
          - ghidra: '12.2'
            java: '25'
            java_distribution: '25.0.5+8'
    defaults:
      run:
        shell: bash
        working-directory: xenon source
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: xenon source
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java_distribution }}
      - name: Verify official Ghidra download
        run: python3 tests/download_ghidra.py '${{ matrix.ghidra }}'
      - name: Install checksum-pinned secrets scanner
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          mkdir "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks"
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"
      - name: Audit source
        run: |
          python3 tests/test_release_audit.py
          python3 tests/release_audit.py . --report "$RUNNER_TEMP/source-audit.json"
          gitleaks dir . --redact=100 --no-banner --log-level error --max-archive-depth 4
      - name: Build twice and qualify the installable archive
        run: python3 tests/ci_qualification.py '${{ matrix.ghidra }}'
      - name: Scan completed distribution
        run: gitleaks dir dist --redact=100 --no-banner --log-level error --max-archive-depth 4
      - name: Upload verified extension and receipts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Xenon360-0.8.3-ghidra-${{ matrix.ghidra }}-${{ github.sha }}
          path: |
            xenon source/dist/ghidra_${{ matrix.ghidra }}_XenonVMX128_0.8.3.zip
            xenon source/dist/ghidra_${{ matrix.ghidra }}_XenonVMX128_0.8.3.zip.sha256
            xenon source/dist/qualification-${{ matrix.ghidra }}.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
